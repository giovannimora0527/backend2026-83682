# ============================================================
#  Configuración del backend - Centro veterinario
#  Los valores pueden cambiarse con variables de entorno:
#    DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# ============================================================
spring.application.name=veterinaria-backend
server.port=8080

# ---- Conexión a SQL Server ----
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:clinica_veterinaria};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:CAMBIA_ESTA_CLAVE}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---- JPA / Hibernate ----
# El esquema lo crea el script SQL (database/01_clinica_veterinaria_sqlserver.sql), Hibernate NO lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JSON ----
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota
