# Perfil de desarrollo local contra la base MySQL existente "clinica".
#
# La contrasena NO se guarda en el repositorio. Defina una de estas opciones:
#   1) Variable de entorno DB_PASSWORD
#   2) Archivo local no versionado config/clinica-local.properties con
#      spring.datasource.password=...
spring.config.import=optional:file:./config/clinica-local.properties

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
