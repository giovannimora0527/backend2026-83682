spring.application.name=clinica

server.port=8080
server.tomcat.max-threads=32
server.servlet.contextPath=/clinica/v1

#Conexion BD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/clinica?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# La BD se comprueba manualmente con sql/03_verificacion.sql, nunca se reconstruye.
spring.jpa.hibernate.ddl-auto=none
