spring.application.name=clinica
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/clinica/v1
server.tomcat.threads.max=32

# Esquema existente: Hibernate nunca crea, altera ni valida-modificando tablas,
# y Spring no ejecuta schema.sql ni data.sql.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Origenes del frontend Angular (lista separada por comas).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
