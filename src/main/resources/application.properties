spring.application.name=clinica
spring.profiles.active=dev

server.port=8080
server.tomcat.threads.max=32
# El JWT lleva los menus en la cabecera Authorization
server.max-http-request-header-size=16KB
server.servlet.context-path=/clinica/v1

# Base de datos (el esquema lo crean los scripts de db/)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none

# Correo
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Seguridad: JWT_SECRET se toma del entorno
app.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost}
app.otp.mostrar-en-log=false

# Inventario y carga masiva
inventario.dias-proximo-vencer=30
inventario.carga.max-filas=5000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Atencion: minutos antes de la cita en que se puede iniciar
atencion.minutos-anticipacion=30

# Swagger: /swagger-ui.html
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# Solo se publica /actuator/health; el correo no decide si el servicio esta sano
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false
