# =========================================================================
# Configuracion general de la aplicacion Spring Boot
# =========================================================================

# Nombre de la aplicacion (solo informativo, aparece en los logs)
spring.application.name=clinica

# Puerto en el que se levanta el servidor. Por defecto Spring usa el 8080,
# lo dejamos explicito para que sea facil de identificar.
server.port=8080

# -------------------------------------------------------------------------
# Base de datos H2 (en memoria)
# Se usa H2 para que el proyecto se pueda ejecutar y sustentar en cualquier
# computador sin necesidad de instalar MySQL/PostgreSQL.
# -------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:clinicadb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita la consola web de H2 para poder ver las tablas y los datos
# desde el navegador en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------------
# Configuracion de JPA / Hibernate
# -------------------------------------------------------------------------
# "update": Hibernate crea/actualiza las tablas automaticamente a partir de
# las entidades (@Entity) cada vez que se inicia la aplicacion.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL que Hibernate va ejecutando (util para aprender
# y para depurar errores durante la sustentacion).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita un warning de Hibernate relacionado con el dialecto de H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
