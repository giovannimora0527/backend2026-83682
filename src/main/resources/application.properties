spring.application.name=clinica
spring.profiles.active=dev

server.port=8080
server.tomcat.threads.max=32
server.servlet.context-path=/clinica/v1

# Base de datos (el esquema lo crean los scripts de db/)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none

# Correo
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Seguridad: JWT_SECRET se toma del entorno
app.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost}
app.otp.mostrar-en-log=false
