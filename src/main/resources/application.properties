spring.application.name=clinica
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=8080
server.servlet.context-path=/clinica/v1
server.tomcat.threads.max=32

# Conexión a base de datos (se puede sobrescribir con variables de entorno en Docker)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}

# Carga masiva de inventario
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# Seguridad (JWT). En producción defina JWT_SECRET con al menos 32 caracteres.
clinica.jwt.secret=${JWT_SECRET:clave-de-desarrollo-clinica-veterinaria-uniminuto-2026}
clinica.jwt.horas=${JWT_HORAS:12}
clinica.zona-horaria=America/Bogota

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
