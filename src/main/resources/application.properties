spring.application.name=clinica
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=8080
server.servlet.context-path=/clinica/v1
server.tomcat.threads.max=32

# Conexión a base de datos (se puede sobrescribir con variables de entorno en Docker)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}

# Carga masiva de inventario
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# Seguridad (JWT). En producción defina JWT_SECRET con al menos 32 caracteres.
clinica.jwt.secret=${JWT_SECRET:clave-de-desarrollo-clinica-veterinaria-uniminuto-2026}
clinica.jwt.horas=${JWT_HORAS:12}
clinica.zona-horaria=America/Bogota

# Verificación en dos pasos: código de 6 caracteres enviado por correo
clinica.otp.habilitado=${OTP_HABILITADO:true}
clinica.otp.minutos=5
clinica.otp.intentos=5
clinica.correo.remitente=${MAIL_FROM:no-responder@clinica-uniminuto.local}

# Servidor de correo (en Docker se usa Mailpit: bandeja de prueba en http://localhost:8025).
# Sin MAIL_HOST el código se escribe en el log del backend (solo para desarrollo).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.default-encoding=UTF-8

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
