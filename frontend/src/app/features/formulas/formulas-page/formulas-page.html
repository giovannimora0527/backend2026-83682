<div class="encabezado-pagina">
  <div>
    <h1>Fórmulas médicas</h1>
    <p class="texto-suave">Fórmulas generadas por los veterinarios, de la más reciente a la más antigua. Nunca se eliminan: se inactivan.</p>
  </div>
  <button type="button" class="btn btn-primario" (click)="nueva()">+ Nueva fórmula</button>
</div>

<app-alerta [mensaje]="mensaje()" (cerrar)="mensaje.set(null)"></app-alerta>

<form class="tarjeta filtros" [formGroup]="filtroForm" (ngSubmit)="buscar()">
  <div class="campo">
    <label for="ff-mascota">Mascota</label>
    <input id="ff-mascota" type="text" formControlName="mascota" placeholder="Nombre de la mascota" />
  </div>
  <div class="campo">
    <label for="ff-cliente">Cliente</label>
    <input id="ff-cliente" type="text" formControlName="cliente" placeholder="Nombre del cliente" />
  </div>
  <div class="campo">
    <label for="ff-medicamento">Medicamento</label>
    <input id="ff-medicamento" type="text" formControlName="medicamento" placeholder="Nombre del medicamento" />
  </div>
  <div class="campo">
    <label for="ff-estado">Estado</label>
    <select id="ff-estado" formControlName="activo">
      <option value="">Todas</option>
      <option value="true">Activas</option>
      <option value="false">Inactivas</option>
    </select>
  </div>
  <div class="campo">
    <label for="ff-desde">Emitidas desde</label>
    <input id="ff-desde" type="date" formControlName="desde" />
  </div>
  <div class="campo">
    <label for="ff-hasta">Emitidas hasta</label>
    <input id="ff-hasta" type="date" formControlName="hasta" />
  </div>
  <div class="filtros-botones">
    <button type="submit" class="btn btn-primario">Buscar</button>
    <button type="button" class="btn" (click)="limpiar()">Limpiar</button>
  </div>
</form>

<div class="tarjeta">
  <app-tabla-datos
    [columnas]="columnas"
    [filas]="filas()"
    [total]="total()"
    [control]="tabla"
    [cargando]="cargando()"
    [acciones]="acciones"
    mensajeVacio="No hay fórmulas que coincidan con la búsqueda."
    (cambio)="cargar()"
  ></app-tabla-datos>
</div>

<ng-template #acciones let-formula>
  <button type="button" class="btn btn-sm" (click)="ver(formula)">Ver</button>
  <button
    type="button"
    class="btn btn-sm"
    (click)="editar(formula)"
    [disabled]="!formula.activo"
    [title]="formula.activo ? '' : 'Una fórmula inactiva no puede modificarse'"
  >
    Editar
  </button>
  <button type="button" class="btn btn-sm" [class.btn-peligro]="formula.activo" (click)="cambiarEstado(formula)">
    {{ formula.activo ? 'Inactivar' : 'Activar' }}
  </button>
</ng-template>

@if (formularioAbierto()) {
  <app-modal [titulo]="formulaEnEdicion() ? 'Editar fórmula #' + formulaEnEdicion()?.id : 'Nueva fórmula médica'" (cerrar)="cerrarFormulario()">
    <app-formula-form [formula]="formulaEnEdicion()" (guardado)="alGuardar($event)" (cancelado)="cerrarFormulario()"></app-formula-form>
  </app-modal>
}

@if (formulaVista(); as formula) {
  <app-modal [titulo]="'Fórmula #' + formula.id + ' — ' + formula.mascotaNombre" [ancho]="true" (cerrar)="formulaVista.set(null)">
    <app-formula-detalle [formula]="formula"></app-formula-detalle>
  </app-modal>
}
